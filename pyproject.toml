[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cagentrix"
version = "0.1.0"
description = "A deterministic, read-only fake LLM API server for coding agents"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "litellm[proxy]>=1.80.0,<2.0.0",
]

[project.scripts]
cagentrix = "cagentrix.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cagentrix"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
